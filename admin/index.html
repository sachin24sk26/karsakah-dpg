<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karsakah Admin Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/karsakah-logo.png" alt="Karsakah Logo">
            </div>
            <ul class="nav-links">
                <li class="active" data-target="dashboard-section"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
                <li data-target="messages-section"><i class="fa-solid fa-envelope"></i> Messages</li>
                <li data-target="schemes-section"><i class="fa-solid fa-newspaper"></i> Schemes</li>
                <li data-target="users-section"><i class="fa-solid fa-users"></i> Users</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search..." id="global-search">
                </div>
                <div class="header-profile">
                    <span class="admin-name">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin Profile">
                </div>
            </header>

            <!-- Sections Container -->
            <div class="sections-container">
                <!-- Dashboard Section -->
                <section id="dashboard-section" class="content-section active">
                    <div class="section-header">
                        <h1>Dashboard Overview</h1>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div class="stat-info">
                                <h3>Total Messages</h3>
                                <p id="total-messages-count">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                            <div class="stat-info">
                                <h3>Total Users</h3>
                                <p id="total-users-count">0</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Messages Section -->
                <section id="messages-section" class="content-section">
                    <div class="section-header">
                        <h1>All Messages</h1>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Subject</th>
                                    <th>Message</th>
                                    <th>Type</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="messages-table-body">
                                <!-- Messages will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Schemes Section -->
                <section id="schemes-section" class="content-section">
                    <div class="section-header">
                        <h1>Scheme Interests</h1>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>User Name</th>
                                    <th>Email</th>
                                    <th>Selected Scheme</th>
                                    <th>Type</th>
                                    <th>State</th>
                                </tr>
                            </thead>
                            <tbody id="schemes-table-body">
                                <!-- Schemes will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Users Section -->
                <section id="users-section" class="content-section">
                    <div class="section-header">
                        <h1>Registered Users</h1>
                    </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>First Contact</th>
                                    <th>Total Interactions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- Users will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
